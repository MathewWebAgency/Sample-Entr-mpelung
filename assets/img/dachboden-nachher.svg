  <line x1="550" y1="70" x2="1100" y2="355" stroke="#6B5D49" stroke-width="14"/>
  <rect x="250" y="296" width="600" height="30" fill="#6B5D49" stroke="#141414" stroke-width="2"/>
  <g transform="rotate(-27.4 330 240)">
    <rect x="250" y="180" width="160" height="120" fill="#D8DFE4" stroke="#F2EFE9" stroke-width="10"/>
    <line x1="330" y1="180" x2="330" y2="300" stroke="#F2EFE9" stroke-width="8"/>
    <rect x="250" y="180" width="160" height="120" fill="none" stroke="#141414" stroke-width="2"/>
  </g>
  <rect y="556" width="1100" height="132" fill="#C7B48F"/>
  <line x1="0" y1="556" x2="1100" y2="556" stroke="#A8977A" stroke-width="2"/>
  <line x1="0" y1="600" x2="1100" y2="600" stroke="#AD9A75" stroke-width="2"/>
  <line x1="0" y1="646" x2="1100" y2="646" stroke="#AD9A75" stroke-width="2"/>
  <!-- Besenrein: angelehnter Besen -->
  <line x1="880" y1="260" x2="846" y2="556" stroke="#8A6B42" stroke-width="7" stroke-linecap="round"/>
  <path d="M824 550 l50 10 -12 56 -56 -12 z" fill="#D9A441" stroke="#141414" stroke-width="2"/>
  <line x1="830" y1="564" x2="820" y2="598" stroke="#141414" stroke-width="1.5"/>
  <line x1="846" y1="567" x2="836" y2="601" stroke="#141414" stroke-width="1.5"/>
  <line x1="862" y1="570" x2="852" y2="604" stroke="#141414" stroke-width="1.5"/>
</svg>
