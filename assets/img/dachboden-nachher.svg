<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 688" preserveAspectRatio="xMidYMid slice">
  <title>Leerer Dachboden nach der Entrümpelung, besenrein</title>
  <!-- Raum-Basis: identisch mit dachboden-vorher.svg -->
  <rect width="1100" height="688" fill="#EFE9DC"/>
  <path d="M0 355 L0 0 H1100 V355 L550 70 Z" fill="#7E6E58"/>
